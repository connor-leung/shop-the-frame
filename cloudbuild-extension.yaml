steps:
  # Package the extension into a zip
  - name: 'ubuntu'
    id: 'package'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        zip -r extension.zip extension/ \
          -x "extension/.DS_Store" \
          -x "extension/config.example.js"
        echo "Packaged extension.zip"
        unzip -l extension.zip

  # Upload and publish to Chrome Web Store
  - name: 'node:20'
    id: 'publish'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        npx chrome-webstore-upload-cli@3 upload \
          --source extension.zip \
          --extension-id $$EXTENSION_ID \
          --client-id $$CLIENT_ID \
          --client-secret $$CLIENT_SECRET \
          --refresh-token $$REFRESH_TOKEN \
          --auto-publish
    secretEnv:
      - EXTENSION_ID
      - CLIENT_ID
      - CLIENT_SECRET
      - REFRESH_TOKEN

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/CHROME_EXTENSION_ID/versions/latest
      env: EXTENSION_ID
    - versionName: projects/$PROJECT_ID/secrets/CHROME_CLIENT_ID/versions/latest
      env: CLIENT_ID
    - versionName: projects/$PROJECT_ID/secrets/CHROME_CLIENT_SECRET/versions/latest
      env: CLIENT_SECRET
    - versionName: projects/$PROJECT_ID/secrets/CHROME_REFRESH_TOKEN/versions/latest
      env: REFRESH_TOKEN

options:
  logging: CLOUD_LOGGING_ONLY
